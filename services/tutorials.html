<script>
  let currentIndex = 0;
  const panelWidth = 270; // 250px video + 20px gap
  const videoRow = document.getElementById('videoRow');
  const totalPanels = videoRow.children.length;

  function scrollVideos(direction) {
    const maxIndex = totalPanels - 3;
    currentIndex = Math.max(0, Math.min(currentIndex + direction, maxIndex));
    videoRow.style.transform = `translateX(-${currentIndex * panelWidth}px)`;
  }
</script>
