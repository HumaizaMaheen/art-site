<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout - Crafterina_by_Humaiza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../style/style.css">
  <style>

    
    body {
      background-color: #f8f9fa;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 10px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #198754;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
    }
    #order-summary {
      background-color: #e9f7ef;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Checkout</h1>
  <form id="checkout-form">
    <label>Name: <input type="text" id="name" required></label>
    <label>Email: <input type="email" id="email" required></label>
    <label>Phone: <input type="tel" id="phone" required></label>
    <label>Address: <textarea id="address" required></textarea></label>
    <button type="submit" class="btn">Submit Order</button>
  </form>

  <div id="order-summary" class="mt-4"></div>

  <div class="mt-4 d-flex justify-content-between">
    <button id="continue-btn" class="btn btn-outline-primary">
      <a href="/services/shop.html" style="color:white; text-decoration:none;">Continue Shopping</a>
    </button>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Your Order</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Filled by JS -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-success" id="confirmBtn">Confirm Order</button>
      </div>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById("checkout-form");
  const modalBody = document.getElementById("modalBody");
  const confirmBtn = document.getElementById("confirmBtn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();

    if (!name || !email || !phone || !address) {
      alert("Please fill out all fields.");
      return;
    }

    const summary = localStorage.getItem("checkoutSummary") || "No items found.";
    const total = localStorage.getItem("checkoutTotal") || 0;

    modalBody.innerHTML = `
      <p><strong>Name:</strong> ${name}</p>
      <p><strong>Email:</strong> ${email}</p>
      <p><strong>Phone:</strong> ${phone}</p>
      <p><strong>Address:</strong> ${address}</p>
      <hr>
      <p><strong>Items:</strong><br>${summary}</p>
      <p><strong>Total:</strong> Rs. ${total}</p>
    `;

    new bootstrap.Modal(document.getElementById("confirmModal")).show();
  });

  confirmBtn.addEventListener("click", async () => {
    try {
      const res = await fetch("http://localhost:4000/cart");
      const cart = await res.json();

      for (const item of cart) {
        await fetch(`http://localhost:4000/cart/${item.id}`, { method: "DELETE" });
      }

      localStorage.removeItem("checkoutSummary");
      localStorage.removeItem("checkoutTotal");

      document.getElementById("checkout-form").style.display = "none";
      const orderSummary = document.getElementById("order-summary");
      orderSummary.style.display = "block";
      orderSummary.innerHTML = `
        <h2 class="text-success mb-3">Thanks for shopping!</h2>
        <p><strong>Your order has been confirmed.</strong></p>
      `;

      bootstrap.Modal.getInstance(document.getElementById("confirmModal")).hide();

    } catch (err) {
      console.error("❌ Error clearing cart:", err);
      alert("Something went wrong while confirming the order.");
    }
  });

  // Floating Cart Button
  const floatingCartBtn = document.createElement("div");
  floatingCartBtn.innerHTML = "🛒";
  floatingCartBtn.style.cssText = `
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #333;
    color: white;
    font-size: 24px;
    padding: 10px 20px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 9999;
  `;
  floatingCartBtn.addEventListener("click", () => {
    window.location.href = "cart.html";
  });
  document.body.appendChild(floatingCartBtn);
</script>

</body>
</html>
